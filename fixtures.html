<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixtures and results | Broadwater Cricket Club</title>
  <meta name="description" content="Fixtures and results for every Broadwater Cricket Club team, with calendars for your phone.">
  <link rel="canonical" href="https://www.broadwatercc.co.uk/fixtures.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Broadwater Cricket Club">
  <meta property="og:title" content="Fixtures and results">
  <meta property="og:description" content="Fixtures and results for every Broadwater Cricket Club team, with calendars for your phone.">
  <meta property="og:url" content="https://www.broadwatercc.co.uk/fixtures.html">
  <meta property="og:image" content="https://www.broadwatercc.co.uk/images/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_GB">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#16295c">
  <link rel="icon" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="preload" href="fonts/libre-caslon-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/libre-franklin-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js" defer></script>
  <script src="js/matches.js" defer></script>
  <script src="js/site.js" defer></script>
  <style>
    .filter { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .filter label { font-weight: 600; }
    .filter select { font: 500 1rem var(--body); padding: 10px 14px; border: 2px solid var(--navy); border-radius: 2px; background: var(--white); color: var(--navy); min-width: 200px; }
  </style>
</head>
<body data-page="fixtures">
<a class="skip" href="#main">Skip to content</a>

<main id="main">
  <section class="page-hero" style="background-image:url('images/BCCStumpsKit.jpg')">
    <div class="wrap">
      <p class="crumb">Every team, every match</p>
      <h1>Fixtures and results</h1>
      <p class="sub-title">Full scorecards are on <a href="https://broadwater.play-cricket.com/home" style="color:var(--gold)">Play-Cricket</a>.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="filter">
        <label for="team-filter">Show</label>
        <select id="team-filter"></select>
      </div>
      <div class="tabs">
        <div class="tablist" role="tablist" aria-label="Fixtures and results">
          <button role="tab" id="tab-fix" aria-controls="panel-fix" aria-selected="true">Fixtures</button>
          <button role="tab" id="tab-res" aria-controls="panel-res" aria-selected="false" tabindex="-1">Results</button>
        </div>
        <div data-sample-note></div>
        <div role="tabpanel" id="panel-fix" aria-labelledby="tab-fix" data-matches="fixtures"></div>
        <div role="tabpanel" id="panel-res" aria-labelledby="tab-res" data-matches="results" hidden></div>
      </div>
      <div data-calendar></div>
    </div>
  </section>
</main>
</body>
</html>
