<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1st XI | Broadwater Cricket Club</title>
  <meta name="description" content="Fixtures, results and squad information for Broadwater Cricket Club's 1st XI in the Sussex Cricket League.">
  <link rel="canonical" href="https://www.broadwatercc.co.uk/first-xi.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Broadwater Cricket Club">
  <meta property="og:title" content="1st XI">
  <meta property="og:description" content="Fixtures, results and squad information for Broadwater Cricket Club's 1st XI in the Sussex Cricket League.">
  <meta property="og:url" content="https://www.broadwatercc.co.uk/first-xi.html">
  <meta property="og:image" content="https://www.broadwatercc.co.uk/images/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_GB">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#16295c">
  <link rel="icon" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="preload" href="fonts/libre-caslon-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/libre-franklin-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js" defer></script>
  <script src="js/matches.js" defer></script>
  <script src="js/site.js" defer></script>
</head>
<!-- Team details (captain, division, photo) come from js/data.js. Change data-team to reuse this page for another side. -->
<body data-page="saturday" data-team="1st-xi">
<a class="skip" href="#main">Skip to content</a>

<main id="main">
  <section class="page-hero" data-t-img>
    <div class="wrap">
      <p class="crumb"><a href="index.html#teams">Saturday XIs</a></p>
      <h1 data-t="name">Team</h1>
      <p class="sub-title"><span data-t="league"></span>, <span data-t="division"></span></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap team-layout">
      <div>
        <p class="lede measure" data-t="blurb"></p>

        <div class="tabs">
          <div class="tablist" role="tablist" aria-label="Matches">
            <button role="tab" id="tab-results" aria-controls="panel-results" aria-selected="true">Results</button>
            <button role="tab" id="tab-fixtures" aria-controls="panel-fixtures" aria-selected="false" tabindex="-1">Fixtures</button>
          </div>
          <div data-sample-note></div>
          <div role="tabpanel" id="panel-results" aria-labelledby="tab-results" data-matches="results"></div>
          <div role="tabpanel" id="panel-fixtures" aria-labelledby="tab-fixtures" data-matches="fixtures" hidden></div>
        </div>
        <div data-calendar></div>
      </div>

      <aside>
        <dl class="team-facts">
          <div><dt>Captain</dt><dd data-t="captain"></dd></div>
          <div data-row><dt>Vice-captain</dt><dd data-t="viceCaptain" data-hide-empty></dd></div>
          <div><dt>League</dt><dd data-t="league"></dd></div>
          <div><dt>Plays</dt><dd data-t="day"></dd></div>
          <div><dt>Home ground</dt><dd>Broadwater Green</dd></div>
        </dl>

        <div class="season-board">
          <h2>This season</h2>
          <div data-season></div>
        </div>

        <div class="aside-cta">
          <h2>Want a game?</h2>
          <p>Availability for Saturday sides is sorted midweek. Get in touch and we'll put you in touch with the captain.</p>
          <a class="btn btn-navy" data-club-mail href="#">Email the club</a>
        </div>
      </aside>
    </div>
  </section>
</main>
</body>
</html>
